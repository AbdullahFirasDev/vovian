name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Unit tests (shared logic, validation, admin utils)
        run: npm test

      - name: Admin typecheck + build
        run: npm run build -w @vovian/admin
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_KEY: ci-placeholder

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,logflare,vector
      - name: Database tests (RLS, pricing, orders)
        run: supabase test db

      - name: Storefront build
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> apps/storefront/.env
          echo "SUPABASE_KEY=$(supabase status -o json | jq -r .PUBLISHABLE_KEY)" >> apps/storefront/.env
          npm run build -w @vovian/storefront

      - name: End-to-end tests
        run: |
          cp supabase/functions/.env.example supabase/functions/.env
          sed -i 's#^ALLOWED_ORIGINS=.*#ALLOWED_ORIGINS=http://localhost:3000#' supabase/functions/.env
          supabase functions serve --env-file supabase/functions/.env &
          npx playwright install --with-deps chromium
          (cd apps/storefront && PORT=3000 node .output/server/index.mjs &)
          npx wait-on http://localhost:3000 --timeout 120000
          npm run test:e2e -- --project=desktop
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/storefront/playwright-report
